<!doctype html><meta charset="utf-8"><title>PrintScope tests</title><pre id="out"></pre><script type="module">import{unitScale}from'./js/model/units.js';import{trimLRU}from'./js/storage/db.js';import{overhangRisk}from'./js/analysis/overhang.js';let n=0;const test=(name,fn)=>{try{fn();out.textContent+=`✓ ${name}\n`;n++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`}},eq=(a,b)=>{if(a!==b)throw Error(`${a} != ${b}`)};test('units',()=>{eq(unitScale('inch'),25.4);eq(unitScale('cm'),10)});test('LRU 10',()=>eq(trimLRU(Array.from({length:11},(_,i)=>({lastOpened:i}))).length,10));test('upward and vertical safe',()=>{eq(overhangRisk(1),0);eq(overhangRisk(0),0)});test('downward risky',()=>eq(overhangRisk(-1),1));out.textContent+=`\n${n}/4 tests passed`;</script>
