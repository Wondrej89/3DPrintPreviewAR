<!doctype html><meta charset="utf-8"><title>PrintScope tests</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><pre id="out"></pre><script type="module">import * as THREE from'three';import{unitScale}from'./js/model/units.js';import{applyTransform,rotate90,placeNormal}from'./js/model/orientation.js';import{trimLRU}from'./js/storage/db.js';import{overhangRisk,addOverhangAttribute}from'./js/analysis/overhang.js';let n=0,total=0;const test=(name,fn)=>{total++;try{fn();out.textContent+=`✓ ${name}\n`;n++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`}},eq=(a,b)=>{if(a!==b)throw Error(`${a} != ${b}`)},near=(a,b)=>{if(Math.abs(a-b)>1e-9)throw Error(`${a} != ${b}`)};test('units',()=>{eq(unitScale('inch'),25.4);eq(unitScale('cm'),10)});test('LRU 10',()=>eq(trimLRU(Array.from({length:11},(_,i)=>({lastOpened:i}))).length,10));test('upward and vertical safe',()=>{eq(overhangRisk(1),0);eq(overhangRisk(0),0)});test('downward risky',()=>eq(overhangRisk(-1),1));test('overhang follows model orientation',()=>{const root=new THREE.Group(),geometry=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,1,0,0,0,0,1],3)).setAttribute('normal',new THREE.Float32BufferAttribute([0,-1,0,0,-1,0,0,-1,0],3)),mesh=new THREE.Mesh(geometry);root.add(mesh);root.position.z=10;addOverhangAttribute(root,1);eq(geometry.attributes.risk.getX(0),0);root.rotation.x=Math.PI/2;addOverhangAttribute(root,1);near(geometry.attributes.risk.getX(0),1)});test('build plate contact is separated from overhang risk',()=>{const root=new THREE.Group(),geometry=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,0,1,0,1,0,0],3)).setAttribute('normal',new THREE.Float32BufferAttribute([0,0,-1,0,0,-1,0,0,-1],3)),mesh=new THREE.Mesh(geometry);root.add(mesh);addOverhangAttribute(root,1);eq(geometry.attributes.contact.getX(0),1);eq(geometry.attributes.risk.getX(0),0)});test('model is centered on bed',()=>{const root=new THREE.Group(),mesh=new THREE.Mesh(new THREE.BoxGeometry(20,40,10));mesh.position.set(35,-12,8);root.add(mesh);applyTransform(root,[0,0,0,1]);const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3());near(center.x,0);near(center.y,0);near(box.min.z,0)});test('rotated model remains centered on bed',()=>{const root=new THREE.Group(),mesh=new THREE.Mesh(new THREE.BoxGeometry(20,40,10));mesh.position.set(35,-12,8);root.add(mesh);applyTransform(root,[0,0,0,1]);rotate90(root,'x');const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3());near(center.x,0);near(center.y,0);near(box.min.z,0)});test('selected face touches bed after prior rotation',()=>{const root=new THREE.Group(),geometry=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,1,0,0,0,1,0,0,0,1],3)),mesh=new THREE.Mesh(geometry);root.add(mesh);applyTransform(root,new THREE.Quaternion().setFromEuler(new THREE.Euler(.4,.7,.2)).toArray());placeNormal(root,new THREE.Vector3(1,1,1).normalize(),mesh);for(const i of[1,2,3]){const vertex=new THREE.Vector3().fromBufferAttribute(geometry.attributes.position,i).applyMatrix4(mesh.matrixWorld);near(vertex.z,0)}const box=new THREE.Box3().setFromObject(root,true);near(box.min.z,0)});out.textContent+=`\n${n}/${total} tests passed`;</script>
