<!doctype html><meta charset="utf-8"><title>PrintScope tests</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><pre id="out"></pre><script type="module">import * as THREE from'three';import{unitScale}from'./js/model/units.js';import{applyTransform,rotate90}from'./js/model/orientation.js';import{trimLRU}from'./js/storage/db.js';import{overhangRisk}from'./js/analysis/overhang.js';let n=0,total=0;const test=(name,fn)=>{total++;try{fn();out.textContent+=`✓ ${name}\n`;n++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`}},eq=(a,b)=>{if(a!==b)throw Error(`${a} != ${b}`)},near=(a,b)=>{if(Math.abs(a-b)>1e-9)throw Error(`${a} != ${b}`)};test('units',()=>{eq(unitScale('inch'),25.4);eq(unitScale('cm'),10)});test('LRU 10',()=>eq(trimLRU(Array.from({length:11},(_,i)=>({lastOpened:i}))).length,10));test('upward and vertical safe',()=>{eq(overhangRisk(1),0);eq(overhangRisk(0),0)});test('downward risky',()=>eq(overhangRisk(-1),1));test('model is centered on bed',()=>{const root=new THREE.Group(),mesh=new THREE.Mesh(new THREE.BoxGeometry(20,40,10));mesh.position.set(35,-12,8);root.add(mesh);applyTransform(root,[0,0,0,1]);const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3());near(center.x,0);near(center.y,0);near(box.min.z,0)});test('rotated model remains centered on bed',()=>{const root=new THREE.Group(),mesh=new THREE.Mesh(new THREE.BoxGeometry(20,40,10));mesh.position.set(35,-12,8);root.add(mesh);applyTransform(root,[0,0,0,1]);rotate90(root,'x');const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3());near(center.x,0);near(center.y,0);near(box.min.z,0)});out.textContent+=`\n${n}/${total} tests passed`;</script>
